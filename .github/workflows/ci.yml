name: CI

# Read-only safety net: unit tests + content/site validation on every push and pull request.
# Note: pushes made by the sync bot (GITHUB_TOKEN) do not trigger workflows; the daily health check covers those.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Validate content and site
        run: node scripts/validate-site.js
