name: Health check

# Daily at 12:00 UTC. GitHub starts scheduled runs hours late (the 03:00 UTC sync has run between 07:26 and 08:24 UTC), so 12:00 is
# comfortably after it. Fails (red run, GitHub emails failed-workflow notifications) when the live site is down, the cache has fallen
# behind the products' latest GitHub releases, the sync has not succeeded in 48 hours, or any workflow has been disabled.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # lets the check see whether any workflow has been switched off

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check site and cache against GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/health-check.js
