name: Sync product cache

on:
  schedule:
    - cron: '0 3 * * *'        # 3am UTC daily
  repository_dispatch:
    types: [product-updated]    # fired by product repos
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no commit)'
        type: boolean
        default: false

permissions:
  contents: write               # hub repo only; product repos are read via public API

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and validate product data
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/sync-products.js

      - name: Commit cache if changed
        # !cancelled(): still commit the good products when the fetch step ended red because another product failed (SPEC-TR TR-05)
        if: ${{ !cancelled() && steps.fetch.outputs.changed == 'true' && inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/cache.json
          git diff --staged --quiet || git commit -m "sync: refresh product cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
